services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      # Web admin panel (webpanel/) — proxy this through your own reverse
      # proxy/auth layer rather than exposing it directly to the internet.
      - "8000:8000"
    volumes:
      # Persistent bot state: ChromaDB, profiles, debates, logs, deployed-server
      # metadata, etc.
      - ./data:/app/data
      # Bot-only SSH key + known_hosts for game server management — NOT your
      # personal ~/.ssh. Scoped per host by deploy/bot-ssh-gate.sh; see README
      # "Scoped SSH access" for setup.
      - ./ssh:/root/.ssh:ro
